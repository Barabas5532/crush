on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  verilog-sim-crush:
    strategy:
      matrix:
        target:
          - sim_alu
          - sim_inst_immediate_decode
          - sim_load_store
          # sim_cpu is not a testbench, but a target for RISCOF testing, so it
          # is not included here
    uses: ./.github/workflows/simulate.yml
    with:
      project: crush
      target: ${{ matrix.target }}
  verilog-sim-crush-example:
    strategy:
      matrix:
        target:
          - sim_memory
          - sim_top
    uses: ./.github/workflows/simulate.yml
    with:
      project: crush_example
      target: ${{ matrix.target }}
  verilog-lint:
    runs-on: ubuntu-22.04
    container:
      image: barabas5532/crush-ci:5
    strategy:
      matrix:
        project: [crush, crush_example]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
          # Every step runs in its own shell. Activating the venv really just
          # modifies the path. Persist the modified path, so that other steps
          # also use the venv.
          echo PATH=$PATH >> $GITHUB_ENV
      - name: Run lint
        run: |
          . script/init.sh
          fusesoc run --target lint --resolve-env-vars-early ${{ matrix.project }}
  riscof-test:
    runs-on: ubuntu-22.04
    container:
      image: barabas5532/crush-ci:5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
          # Every step runs in its own shell. Activating the venv really just
          # modifies the path. Persist the modified path, so that other steps
          # also use the venv.
          echo PATH=$PATH >> $GITHUB_ENV
      - name: Run RISCOF
        timeout-minutes: 5
        run: |
          . script/init.sh
          script/compliance.sh
  synthesis:
    runs-on: ubuntu-22.04
    container:
      image: barabas5532/crush-ci:5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
          # Every step runs in its own shell. Activating the venv really just
          # modifies the path. Persist the modified path, so that other steps
          # also use the venv.
          echo PATH=$PATH >> $GITHUB_ENV
      - name: Run synthesis
        timeout-minutes: 1
        run: |
          . script/init.sh
          fusesoc --verbose run crush_example
  firmware:
    runs-on: ubuntu-22.04
    container:
      image: barabas5532/crush-ci:5
    defaults:
      run:
        working-directory: crush_example/fw
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=TC-crush.cmake
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: |
            fw/build/crush-blinky
            fw/build/crush-blinky.bin
            fw/build/crush-blinky.data
