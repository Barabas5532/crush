name: Simulate

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      target:
        required: true
        type: string

jobs:
  simulate:
    runs-on: ubuntu-22.04
    container:
      image: barabas5532/crush-ci:5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
          # Every step runs in its own shell. Activating the venv really just
          # modifies the path. Persist the modified path, so that other steps
          # also use the venv.
          echo PATH=$PATH >> $GITHUB_ENV
      - name: Run simulation
        timeout-minutes: 1
        run: |
          . script/init.sh
          fusesoc run --target ${{ inputs.target }} --resolve-env-vars-early ${{ inputs.project }}
